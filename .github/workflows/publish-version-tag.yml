name: Publish Version Tag

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: publish-version-tag
  cancel-in-progress: false

jobs:
  publish-tag:
    name: "Compute and publish semver tag"
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and publish next semver tag
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/compute-next-tag.sh "$PR_TITLE"
