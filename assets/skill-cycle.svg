<svg viewBox="0 0 696 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Constitution bootstraps product-spec, tech-spec and roadmap, then feeds a closed loop: specify-feature, clarify-feature, plan-feature, implement-feature, clean-feature, back to specify-feature">
  <title>My AIsy Toolkit — constitution and skill cycle</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #1e1e2a;
      --muted: #6b7280;
      --border: #d8dce3;
      --accent: #d9603b;
      --surface: #f5f6f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14151c;
        --ink: #e8e9ee;
        --muted: #9aa0ac;
        --border: #33364a;
        --accent: #f0885a;
        --surface: #1c1e29;
      }
    }
    text { fill: var(--ink); font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
    .muted { fill: var(--muted); }
    .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
    .node-accent { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
    .badge { fill: var(--paper); stroke: var(--border); stroke-width: 1.5; }
    .edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="696" height="376" fill="var(--paper)"/>

  <!-- conectores -->
  <path class="edge" d="M 160,104 L 160,144" marker-end="url(#arrow)"/>
  <path class="edge" d="M 236,168 L 292,168" marker-end="url(#arrow)"/>
  <path class="edge" d="M 444,168 L 500,168" marker-end="url(#arrow)"/>
  <path class="edge" d="M 576,192 C 656,192 656,288 576,288" marker-end="url(#arrow)"/>
  <path class="edge" d="M 500,312 L 236,312" marker-end="url(#arrow)"/>
  <path class="edge" d="M 160,288 C 80,288 80,192 160,192" marker-end="url(#arrow)"/>

  <!-- constitution -->
  <rect class="node-accent" x="40" y="40" width="240" height="64" rx="8"/>
  <text x="160" y="64" text-anchor="middle" class="mono" font-size="13" font-weight="600">/constitution</text>
  <text x="160" y="80" text-anchor="middle" class="mono muted" font-size="9">product-spec &#183; tech-spec &#183; roadmap</text>
  <circle class="badge" cx="40" cy="40" r="12"/>
  <text x="40" y="44" text-anchor="middle" class="mono" font-size="11" font-weight="600">1</text>

  <!-- ciclo -->
  <rect class="node" x="84" y="144" width="152" height="48" rx="8"/>
  <text x="160" y="172" text-anchor="middle" class="mono" font-size="11" font-weight="600">/specify-feature</text>
  <circle class="badge" cx="84" cy="144" r="12"/>
  <text x="84" y="148" text-anchor="middle" class="mono" font-size="11" font-weight="600">2</text>

  <rect class="node" x="292" y="144" width="152" height="48" rx="8"/>
  <text x="368" y="172" text-anchor="middle" class="mono" font-size="11" font-weight="600">/clarify-feature</text>
  <circle class="badge" cx="292" cy="144" r="12"/>
  <text x="292" y="148" text-anchor="middle" class="mono" font-size="11" font-weight="600">3</text>

  <rect class="node" x="500" y="144" width="152" height="48" rx="8"/>
  <text x="576" y="172" text-anchor="middle" class="mono" font-size="11" font-weight="600">/plan-feature</text>
  <circle class="badge" cx="500" cy="144" r="12"/>
  <text x="500" y="148" text-anchor="middle" class="mono" font-size="11" font-weight="600">4</text>

  <rect class="node" x="500" y="288" width="152" height="48" rx="8"/>
  <text x="576" y="316" text-anchor="middle" class="mono" font-size="11" font-weight="600">/implement-feature</text>
  <circle class="badge" cx="500" cy="288" r="12"/>
  <text x="500" y="292" text-anchor="middle" class="mono" font-size="11" font-weight="600">5</text>

  <rect class="node" x="84" y="288" width="152" height="48" rx="8"/>
  <text x="160" y="316" text-anchor="middle" class="mono" font-size="11" font-weight="600">/clean-feature</text>
  <circle class="badge" cx="84" cy="288" r="12"/>
  <text x="84" y="292" text-anchor="middle" class="mono" font-size="11" font-weight="600">6</text>
</svg>
