<svg viewBox="0 0 580 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Constitution bootstraps product-spec, tech-spec and roadmap, then feeds a closed counter-clockwise loop: specify-feature, clarify-feature, plan-feature, implement-feature, clean-feature, back to specify-feature">
  <title>My AIsy Toolkit — constitution and skill cycle</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --pill: #e6edf3;
      --pill-text: #0d1117;
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
    .muted { fill: var(--muted); }
    .card { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .pill { fill: var(--pill); }
    .pill-num { fill: var(--pill-text); font-weight: 700; }
    .path { stroke: var(--fg); stroke-width: 1.25; fill: none; }
    .path-repeat { stroke: var(--fg); stroke-width: 1.25; fill: none; stroke-dasharray: 1,4; stroke-linecap: round; }
    .leader { stroke: var(--border); stroke-width: 1; stroke-dasharray: 1,3; stroke-linecap: round; }
    .chip { fill: var(--bg); }
    .label { fill: var(--fg); }
  </style>

  <rect width="580" height="400" fill="var(--bg)"/>

  <!-- conectores -->
  <path class="path" d="M 148,128 L 148,168"/>
  <path class="path" d="M 148,184 C 84,184 84,304 148,304 L 468,304 C 532,304 532,184 468,184"/>
  <path class="path-repeat" d="M 468,184 L 148,184"/>
  <line class="leader" x1="148" y1="200" x2="148" y2="220"/>
  <line class="leader" x1="468" y1="200" x2="468" y2="220"/>
  <line class="leader" x1="148" y1="320" x2="148" y2="340"/>
  <line class="leader" x1="308" y1="320" x2="308" y2="340"/>
  <line class="leader" x1="468" y1="320" x2="468" y2="340"/>

  <!-- constitution -->
  <rect class="card" x="40" y="40" width="216" height="88" rx="8"/>
  <text x="60" y="64" class="mono" font-size="13" font-weight="600">/constitution</text>
  <text x="60" y="80" class="mono muted" font-size="10">&#183; product-spec</text>
  <text x="60" y="96" class="mono muted" font-size="10">&#183; tech-spec</text>
  <text x="60" y="112" class="mono muted" font-size="10">&#183; roadmap</text>
  <circle class="pill" cx="40" cy="40" r="16"/>
  <text x="40" y="44" text-anchor="middle" font-size="12" class="pill-num">1</text>

  <!-- ciclo -->
  <circle class="pill" cx="148" cy="184" r="16"/>
  <text x="148" y="188" text-anchor="middle" font-size="12" class="pill-num">2</text>
  <rect class="chip" x="84" y="220" width="128" height="16" rx="4"/>
  <text x="148" y="232" text-anchor="middle" class="mono label" font-size="11">/specify-feature</text>

  <circle class="pill" cx="148" cy="304" r="16"/>
  <text x="148" y="308" text-anchor="middle" font-size="12" class="pill-num">3</text>
  <rect class="chip" x="88" y="340" width="120" height="16" rx="4"/>
  <text x="148" y="352" text-anchor="middle" class="mono label" font-size="11">/clarify-feature</text>

  <circle class="pill" cx="308" cy="304" r="16"/>
  <text x="308" y="308" text-anchor="middle" font-size="12" class="pill-num">4</text>
  <rect class="chip" x="260" y="340" width="96" height="16" rx="4"/>
  <text x="308" y="352" text-anchor="middle" class="mono label" font-size="11">/plan-feature</text>

  <circle class="pill" cx="468" cy="304" r="16"/>
  <text x="468" y="308" text-anchor="middle" font-size="12" class="pill-num">5</text>
  <rect class="chip" x="396" y="340" width="144" height="16" rx="4"/>
  <text x="468" y="352" text-anchor="middle" class="mono label" font-size="11">/implement-feature</text>

  <circle class="pill" cx="468" cy="184" r="16"/>
  <text x="468" y="188" text-anchor="middle" font-size="12" class="pill-num">6</text>
  <rect class="chip" x="416" y="220" width="104" height="16" rx="4"/>
  <text x="468" y="232" text-anchor="middle" class="mono label" font-size="11">/clean-feature</text>
</svg>
